    <style>
      :root{--neon-cyan:#38bdf8;--neon-violet:#818cf8;--neon-green:#34d399;--dark-bg:#05080f;--dark-surface:#0a0f1c;--dark-card:#0e1626;--grid-color:rgba(56,189,248,0.045);--accent-glow:rgba(56,189,248,0.16);--text-bright:#f8fafc;--text-primary:#e2e8f0;--text-strong:#cbd5e1;--text-body:#94a3b8;--text-muted:#64748b;--text-faint:#475569}
      html{scroll-behavior:smooth}
      html.dark{--dark-bg:#05080f;--dark-surface:#0a0f1c;--dark-card:#0e1626;--header-bg:rgba(5,8,15,0.82);--mobile-menu-bg:rgba(5,8,15,0.98);--overlay-bg:rgba(5,8,15,0.92)}
      html.light{--dark-bg:#f4f7fb;--dark-surface:#ffffff;--dark-card:#eaf1fa;--grid-color:rgba(56,132,255,0.07);--header-bg:rgba(255,255,255,0.86);--mobile-menu-bg:rgba(255,255,255,0.98);--overlay-bg:rgba(244,247,251,0.94);--text-bright:#0b1220;--text-primary:#16213a;--text-strong:#1e293b;--text-body:#3f4c63;--text-muted:#5b6b85;--text-faint:#8a9ab0}
      html.light body{background:var(--dark-bg);color:#0f172a}
      html.light .glass-card{background:rgba(255,255,255,0.82);border-color:rgba(15,23,42,0.08)}
      html.light .glass-card:hover{border-color:rgba(56,189,248,0.4)}
      html.light .text-white,html.light .group-hover\:text-white{color:#0f172a !important}
      html.light [style*="color: #fff"]{color:#0f172a !important}
      html.light [style*="color:'#fff"]{color:#0f172a !important}
      html.light .cyber-btn:hover,html.light .cyber-btn:focus,html.light .cyber-btn-violet:hover{color:#fff !important}
      *,*::before,*::after{box-sizing:border-box}
      body{font-family:"Inter",sans-serif;background:var(--dark-bg);color:var(--text-primary);overflow-x:hidden;-webkit-font-smoothing:antialiased}
      body::before{content:"";position:fixed;inset:0;background:radial-gradient(1100px 500px at 20% -10%,rgba(56,189,248,0.07),transparent 60%),radial-gradient(900px 500px at 90% 110%,rgba(129,140,248,0.06),transparent 60%);pointer-events:none;z-index:0}
      section[id]{scroll-margin-top:88px}
      ::-webkit-scrollbar{width:10px;height:10px}
      ::-webkit-scrollbar-track{background:var(--dark-bg)}
      ::-webkit-scrollbar-thumb{background:rgba(148,163,184,0.28);border-radius:6px;border:2px solid var(--dark-bg)}
      ::-webkit-scrollbar-thumb:hover{background:rgba(56,189,248,0.45)}
      ::selection{background:rgba(56,189,248,0.28);color:inherit}

      /* Tipografia */
      .font-orbitron{font-family:"Space Grotesk",sans-serif;letter-spacing:-0.02em}
      .font-mono-jb,.font-mono{font-family:"JetBrains Mono",monospace}
      .section-label{font-family:"Inter",sans-serif;font-weight:600;font-size:0.72rem;letter-spacing:0.28em;text-transform:uppercase;color:var(--neon-cyan)}
      .cyber-tag{font-family:"JetBrains Mono",monospace;font-size:0.65rem;padding:3px 10px;border:1px solid rgba(56,189,248,0.22);color:rgba(56,189,248,0.85);background:rgba(56,189,248,0.06);border-radius:999px;letter-spacing:0.02em;display:inline-block;white-space:nowrap}
      .neon-text{color:var(--neon-cyan);text-shadow:0 0 24px rgba(56,189,248,0.25)}
      .neon-violet{color:var(--neon-violet);text-shadow:0 0 24px rgba(129,140,248,0.25)}
      .neon-green{color:var(--neon-green);text-shadow:0 0 20px rgba(52,211,153,0.25)}

      /* Tarjetas glass premium */
      .glass-card{background:rgba(14,22,38,0.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(148,163,184,0.12);transition:border-color 0.25s ease,box-shadow 0.25s ease}
      .glass-card:hover{border-color:rgba(56,189,248,0.32);box-shadow:0 12px 40px rgba(2,6,23,0.45)}
      .cyber-grid{background-image:linear-gradient(var(--grid-color) 1px,transparent 1px),linear-gradient(90deg,var(--grid-color) 1px,transparent 1px);background-size:56px 56px}

      /* Botones premium */
      .cyber-btn{position:relative;display:inline-block;font-family:"Inter",sans-serif;font-weight:600;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;padding:13px 30px;border-radius:10px;border:1px solid rgba(56,189,248,0.45);color:var(--neon-cyan);background:linear-gradient(135deg,rgba(56,189,248,0.12),rgba(56,189,248,0.02));transition:all 0.25s ease;cursor:pointer;overflow:hidden;text-align:center}
      .cyber-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--neon-cyan),var(--neon-violet));opacity:0;transition:opacity 0.25s ease;z-index:-1}
      .cyber-btn:hover{color:#fff;border-color:transparent;box-shadow:0 8px 30px rgba(56,189,248,0.28);transform:translateY(-1px)}
      .cyber-btn:hover::before{opacity:1}
      .cyber-btn:focus-visible{outline:2px solid var(--neon-cyan);outline-offset:3px}
      .cyber-btn-violet{border-color:rgba(129,140,248,0.45);color:var(--neon-violet);background:linear-gradient(135deg,rgba(129,140,248,0.12),rgba(129,140,248,0.02))}
      .cyber-btn-violet:hover{color:#fff;border-color:transparent;box-shadow:0 8px 30px rgba(129,140,248,0.28)}
      .cyber-btn-violet::before{background:linear-gradient(135deg,var(--neon-violet),var(--neon-cyan))}
      .cyber-btn:active{transform:translateY(0) scale(0.99)}

      /* Navegacion */
      .nav-link{position:relative;transition:color 0.2s ease}
      .nav-link::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;border-radius:2px;background:linear-gradient(to right,var(--neon-cyan),var(--neon-violet));transform:scaleX(0);transform-origin:left;transition:transform 0.25s ease}
      .nav-link:hover::after{transform:scaleX(1)}
      .section-divider{position:relative;height:2px;margin:0 auto;max-width:min(240px,80vw);opacity:0.5}
      .section-divider::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(to right,transparent,rgba(56,189,248,0.25),transparent)}
      .section-divider::after{content:"";position:absolute;left:calc(50% - 3px);top:-1.5px;width:6px;height:6px;border-radius:50%;background:var(--neon-cyan);box-shadow:0 0 10px rgba(56,189,248,0.5)}

      /* Animaciones ligeras */
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      .float-anim{animation:float 5s ease-in-out infinite}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      .blink{animation:blink 1.1s step-end infinite}
      @keyframes auroraA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,30px) scale(1.1)}}
      @keyframes auroraB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,-40px) scale(1.12)}}
      @keyframes scrollBounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}
      @keyframes pulse-glow{0%,100%{opacity:1}50%{opacity:0.55}}
      .pulse-glow{animation:pulse-glow 2s ease-in-out infinite}
      @keyframes border-spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
      @keyframes carousel-progress{0%{width:0}100%{width:100%}}
      @keyframes proj-kenburns{0%{transform:scale(1.02) translate(0,0)}100%{transform:scale(1.16) translate(-1.8%,-1.4%)}}

      /* Transiciones hover coherentes */
      .skill-card,.cert-card,.testimonial-card,.service-card{transition:transform 0.22s ease,box-shadow 0.22s ease,border-color 0.22s ease}
      .skill-card:hover{transform:translateX(4px);border-color:rgba(56,189,248,0.3) !important}
      .cert-card:hover{transform:translateY(-6px);box-shadow:0 16px 44px rgba(2,6,23,0.5)}
      .testimonial-card:hover{transform:translateY(-4px)}
      .service-card:hover{transform:translateY(-4px);box-shadow:0 14px 36px rgba(2,6,23,0.45)}
      .icon-box{transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
      .group:hover .icon-box{transform:scale(1.06)}

      /* WhatsApp */
      .wa-ping{animation:wa-ping 2s ease-out infinite}
      @keyframes wa-ping{0%{transform:scale(1);opacity:1}70%,100%{transform:scale(1.5);opacity:0}}

      /* Accesibilidad */
      a:focus-visible,button:focus-visible{outline:2px solid var(--neon-cyan);outline-offset:3px;border-radius:4px}
      @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms !important;transition-duration:0.01ms !important}html{scroll-behavior:auto}}
      @media (max-width:768px){button,a{min-height:44px}}
    </style>
  </head>
