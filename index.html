  <body class="scanlines dark">
    <div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>
    <div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      (function(){
        if(window.matchMedia('(hover:none),(pointer:coarse)').matches)return;
        var dot=document.getElementById('cursorDot');
        var ring=document.getElementById('cursorRing');
        if(!dot||!ring)return;
        var mouseX=-100,mouseY=-100,ringX=-100,ringY=-100,visible=false;
        dot.style.opacity='0';ring.style.opacity='0';
        document.addEventListener('mousemove',function(e){
          mouseX=e.clientX;mouseY=e.clientY;
          dot.style.transform='translate('+(mouseX-4)+'px,'+(mouseY-4)+'px)';
          if(!visible){visible=true;dot.style.opacity='1';ring.style.opacity='1';}  
        },{passive:true});
        document.addEventListener('mouseleave',function(){dot.style.opacity='0';ring.style.opacity='0';visible=false;});
        document.addEventListener('mouseenter',function(){if(visible){dot.style.opacity='1';ring.style.opacity='1';}});
        function animateRing(){
          ringX+=(mouseX-ringX)*0.15;ringY+=(mouseY-ringY)*0.15;
          ring.style.transform='translate('+(ringX-18)+'px,'+(ringY-18)+'px)';
          requestAnimationFrame(animateRing);
        }
        animateRing();
        var hovered=new WeakSet();
        function addHover(el){
          if(hovered.has(el))return;hovered.add(el);
          el.addEventListener('mouseenter',function(){ring.classList.add('hovering');});
          el.addEventListener('mouseleave',function(){ring.classList.remove('hovering');});
        }
        document.querySelectorAll('a,button,[role=button]').forEach(addHover);
        new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.nodeType!==1)return;if(n.matches&&n.matches('a,button,[role=button]'))addHover(n);if(n.querySelectorAll)n.querySelectorAll('a,button,[role=button]').forEach(addHover);});});}).observe(document.body,{childList:true,subtree:true});
      })();
    </script>
