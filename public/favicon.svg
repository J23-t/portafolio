<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bf00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Fondo oscuro con borde neon -->
  <rect width="100" height="100" rx="18" fill="#020408"/>
  <rect width="100" height="100" rx="18" fill="none" stroke="url(#g)" stroke-width="2.5"/>
  <!-- Letras JT con glow -->
  <text x="50" y="68" font-family="Arial Black, sans-serif" font-size="46" font-weight="900"
    fill="url(#g)" text-anchor="middle" filter="url(#glow)">JT</text>
</svg>
